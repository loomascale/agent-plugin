interface:
  display_name: "Getting started with LoomaScale"
  short_description: "See what changed this week and what to check next"
  default_prompt: "Use $getting-started to check my LoomaScale connections, show my first weekly snapshot and suggest what I can investigate next."

dependencies:
  tools:
    - type: "mcp"
      value: "loomascale"
      description: "Full LoomaScale plugin for connected advertising and marketing data"
      transport: "streamable_http"
      url: "https://api.loomascale.com/mcp"

policy:
  allow_implicit_invocation: true
