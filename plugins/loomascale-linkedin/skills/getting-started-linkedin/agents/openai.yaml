interface:
  display_name: "Getting started with LinkedIn Ads"
  short_description: "Weekly LinkedIn spend and leads"
  default_prompt: "Use $getting-started-linkedin to check my LinkedIn Ads connection and show what changed in spend and leads this week."

dependencies:
  tools:
    - type: "mcp"
      value: "loomascale-linkedin"
      description: "LoomaScale LinkedIn Ads connection and reporting tools"
      transport: "streamable_http"
      url: "https://api.loomascale.com/mcp/linkedin"

policy:
  allow_implicit_invocation: true
