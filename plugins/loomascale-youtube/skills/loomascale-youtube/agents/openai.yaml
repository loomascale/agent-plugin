interface:
  display_name: "YouTube Ads | LoomaScale"
  short_description: "Report and run YouTube ads"
  default_prompt: "Use $loomascale-youtube to compare my YouTube ads across in-stream, in-feed and Shorts and find spend without conversions."

dependencies:
  tools:
    - type: "mcp"
      value: "loomascale-youtube"
      description: "LoomaScale YouTube Ads reporting, Demand Gen and campaign tools"
      transport: "streamable_http"
      url: "https://api.loomascale.com/mcp/youtube"

policy:
  allow_implicit_invocation: true
